<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ff7eb6">
<title>Panel Admin · Watermark Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="auth.css">
<link rel="stylesheet" href="admin.css">
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
</head>
<body class="gated adminpg">
<div class="blob b1"></div><div class="blob b2"></div>
<div class="adm" id="adm">
  <header class="atop">
    <div class="gmark sm">🎀</div>
    <div class="ttl"><h1>Panel Admin</h1><p>Watermark Studio · by Rizanta Studio</p></div>
    <button class="ib" type="button" data-set="tema" aria-label="Tema & pengaturan" title="Tema & pengaturan">🎨</button>
    <a class="btn" href="index.html">← Kasir</a>
    <button class="btn" id="out" type="button">Keluar</button>
  </header>
  <div id="denied" class="gcard" hidden><div class="mico">⛔</div><h3>Khusus admin</h3><p class="gsub">Akun ini bukan admin. Masuk dengan akun admin untuk membuka panel.</p><a class="btn pri wide" href="index.html">Kembali ke kasir</a><button class="btn wide" id="out2" type="button">Ganti akun</button></div>
  <main id="panel" hidden>
    <div class="stats" id="stats"></div>
    <div class="tools">
      <input type="search" id="q" placeholder="Cari username…" aria-label="Cari username">
      <button class="btn pri" id="add" type="button">+ Member</button>
      <button class="btn" id="rf" type="button">↻</button>
    </div>
    <div class="chips" id="flt"></div>
    <div id="list" class="mlist"></div>
  </main>
  <footer class="gcred" id="acred"></footer>
</div>
<div id="toast" role="status"></div>
<div class="mdl" id="em" hidden><div class="mcard ed"></div></div>
<script src="config.js"></script>
<script src="api.js"></script>
<script>window.WM_PAGE = 'admin';</script>
<script src="auth.js"></script>
<script src="admin.js"></script>
<script src="settings.js"></script>
<script>(()=>{const c=WM_CONFIG.CREDITS||{};document.getElementById("acred").innerHTML=`Dibuat dengan 💖 oleh <b>${c.brand||""}</b>${c.dev?` · Dev <a href="${c.link||"#"}" target="_blank" rel="noopener">${c.dev}</a>`:""}`})()</script>
</body>
</html>
